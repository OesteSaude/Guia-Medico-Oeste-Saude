<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guia Médico Oeste Saúde</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-100 font-sans">
    <script>
    var APP_CONFIG = {
        gasEndpoint: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRnL0LxPL9cWrtI0WqnZhgK4_KmP1m79H1zv1LVmxxRz3HJqyeq7Edn6oPAzft6SvmoGXOPHFBzVMrK/pub?gid=489930255&single=true&output=csv'
    };
</script>
    <header class="sticky top-0 bg-white shadow-md z-10" role="banner" aria-label="Cabeçalho principal">
        <div class="container mx-auto px-4 py-4 flex items-center justify-between">
            <img src="https://i.imgur.com/l4tIG6t.png" alt="Logo Oeste Saúde" width="300" height="230" class="mr-4" aria-label="Logo da Oeste Saúde">
            <h1 class="text-2xl font-bold text-gray-800">Guia Médico Oeste Saúde</h1>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8" role="main" aria-label="Conteúdo principal">
        <section class="mb-8" aria-labelledby="jornadas-title">
            <h2 id="jornadas-title" class="text-xl font-semibold mb-4">Jornadas</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4">
                <div class="bg-white p-4 rounded-lg shadow-md cursor-pointer" data-jornada="crianca" role="button" tabindex="0" aria-label="Jornada Criança: Pediatria & Desenvolvimento" aria-describedby="desc-crianca">
                    <h3 class="font-bold">Criança</h3>
                    <p id="desc-crianca">Pediatria & Desenvolvimento</p>
                </div>
                <div class="bg-white p-4 rounded-lg shadow-md cursor-pointer" data-jornada="mulher" role="button" tabindex="0" aria-label="Jornada Mulher: Cuidado Integral" aria-describedby="desc-mulher">
                    <h3 class="font-bold">Mulher</h3>
                    <p id="desc-mulher">Cuidado Integral</p>
                </div>
                <div class="bg-white p-4 rounded-lg shadow-md cursor-pointer" data-jornada="mente" role="button" tabindex="0" aria-label="Jornada Mente: Saúde Mental" aria-describedby="desc-mente">
                    <h3 class="font-bold">Mente</h3>
                    <p id="desc-mente">Saúde Mental</p>
                </div>
                <div class="bg-white p-4 rounded-lg shadow-md cursor-pointer" data-jornada="longevidade" role="button" tabindex="0" aria-label="Jornada Longevidade: Movimento & Senior" aria-describedby="desc-longevidade">
                    <h3 class="font-bold">Longevidade</h3>
                    <p id="desc-longevidade">Movimento & Senior</p>
                </div>
                <div class="bg-white p-4 rounded-lg shadow-md cursor-pointer" data-jornada="diagnostico" role="button" tabindex="0" aria-label="Jornada Diagnóstico: Exames & Laboratórios" aria-describedby="desc-diagnostico">
                    <h3 class="font-bold">Diagnóstico</h3>
                    <p id="desc-diagnostico">Exames & Laboratórios</p>
                </div>
            </div>
        </section>

        <section class="mb-8" aria-labelledby="filtros-title">
            <h2 id="filtros-title" class="text-xl font-semibold mb-4">Filtros</h2>
            <div class="flex flex-wrap gap-4 mb-4">
                <input type="text" id="filterName" placeholder="Nome" class="border p-2 rounded" aria-label="Filtrar por nome">
                <input type="text" id="filterSpecialty" placeholder="Especialidade" class="border p-2 rounded" aria-label="Filtrar por especialidade">
                <input type="text" id="filterCity" placeholder="Cidade" class="border p-2 rounded" aria-label="Filtrar por cidade">
                <button id="btnClear" class="bg-blue-500 text-white px-4 py-2 rounded" aria-label="Limpar filtros">Limpar</button>
            </div>
            <div id="quickFiltersBadges" class="flex flex-wrap gap-2" aria-label="Badges de filtros rápidos"></div>
        </section>

        <div id="resultsInfo" class="mb-4 hidden" aria-live="polite" aria-label="Informações dos resultados"></div>

        <button id="btnUrgency" class="fixed bottom-4 right-4 bg-red-500 text-white px-4 py-2 rounded-full animate-pulse hidden" aria-label="Botão de urgência">Urgência</button>

        <div id="loadingSpinner" class="text-center py-8 hidden" aria-label="Carregando resultados">
            <div class="spinner-border animate-spin inline-block w-8 h-8 border-4 rounded-full" role="status"></div>
            <span class="sr-only">Carregando...</span>
        </div>

        <div id="resultsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" aria-label="Container de resultados"></div>

        <div id="emptyState" class="text-center py-8 hidden" aria-label="Estado vazio">
            <p>Nenhum resultado encontrado.</p>
        </div>
    </main>

    <div id="modalMedicosCentro" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden" role="dialog" aria-labelledby="modal-title" aria-modal="true" aria-hidden="true">
        <div class="bg-white p-6 rounded-lg max-w-md w-full" role="document">
            <h3 id="modal-title" class="text-lg font-bold mb-4">Centro Médico</h3>
            <ul id="medicosLista" class="list-disc pl-5" aria-label="Lista de médicos"></ul>
            <button class="mt-4 bg-gray-500 text-white px-4 py-2 rounded" aria-label="Fechar modal">Fechar</button>
        </div>
    </div>

    <script src="js/constants.js" defer></script>
    <script src="js/app.js" defer></script>
</body>
</html>
